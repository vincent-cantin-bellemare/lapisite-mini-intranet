# Generated by `make sdk`: do not edit (the version lives in sdk/VERSION).
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lapisite"
version = "0.1.0"
description = "Official Python SDK of the Lapisite API (Studio, Audits, Leads)"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Documentation = "https://docs.lapisite.com/docs/en/sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lapisite = ["py.typed"]
